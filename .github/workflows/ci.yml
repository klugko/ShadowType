name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release --workspace
      - name: Terminal end-to-end tests
        if: runner.os == 'Linux'
        run: |
          python3 tests/e2e/solo.py
          python3 tests/e2e/multiplayer.py
      - uses: actions/upload-artifact@v4
        with:
          name: code-racer-${{ runner.os }}
          path: |
            target/release/code-racer
            target/release/code-racer.exe
            target/release/code-racer-server
            target/release/code-racer-server.exe
          if-no-files-found: error

  fedora:
    name: Fedora packages
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust from Fedora
        run: dnf install -y --setopt=install_weak_deps=False rust cargo gcc
      - name: Test
        run: cargo test --workspace --locked
      - name: Install
        run: cargo install --locked --path . && cargo install --locked --path crates/server

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as manifest:
              print("version=" + tomllib.load(manifest)["workspace"]["package"]["rust-version"])
          PY
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --locked

  container:
    name: Server container
    needs: [quality, fedora, msrv]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: code-racer-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name race -p 8080:8080 code-racer-server:ci
          trap 'docker logs race; docker rm -f race > /dev/null' EXIT
          timeout 20 sh -c 'until docker logs race 2>&1 | grep -q "race server listening"; do sleep 0.2; done'
          python3 - <<'PY'
          import socket
          with socket.create_connection(("127.0.0.1", 8080), timeout=5) as connection:
              connection.sendall(
                  b"GET / HTTP/1.1\r\nHost: localhost\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n"
                  b"Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\nSec-WebSocket-Version: 13\r\n\r\n"
              )
              reply = connection.recv(4096)
          assert b"101 Switching Protocols" in reply, reply
          PY
          docker stop --timeout 5 race
          status=$(docker inspect --format '{{.State.ExitCode}}' race)
          [ "$status" = 0 ] || { echo "the server exited with status $status after SIGTERM"; exit 1; }
      - name: Publish the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/code-racer-server
          docker tag code-racer-server:ci "$image:latest"
          docker tag code-racer-server:ci "$image:${{ github.sha }}"
          docker push "$image:latest"
          docker push "$image:${{ github.sha }}"
