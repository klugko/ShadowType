name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Terminal interaction smoke test
        if: runner.os == 'Linux'
        run: python3 tests/terminal_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: code-racer-${{ matrix.os }}
          path: |
            target/release/code-racer
            target/release/code-racer.exe
            target/release/code-racer-server
            target/release/code-racer-server.exe
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: code-racer-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test server container
        run: |
          docker run -d --name race -p 8080:8080 code-racer-server:ci
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:8080; then break; fi
            sleep 1
          done
          docker logs race
          test "$(docker inspect -f '{{.State.Running}}' race)" = true
          python3 - <<'PY'
          import socket
          s = socket.create_connection(('127.0.0.1', 8080), timeout=5)
          s.sendall(b'GET / HTTP/1.1\r\nHost: localhost\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\nSec-WebSocket-Version: 13\r\n\r\n')
          assert b'101 Switching Protocols' in s.recv(4096)
          s.close()
          PY
          docker stop race
      - name: Publish validated server image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag code-racer-server:ci ghcr.io/klugko/code-racer-server:latest
          docker tag code-racer-server:ci ghcr.io/klugko/code-racer-server:${{ github.sha }}
          docker push ghcr.io/klugko/code-racer-server:latest
          docker push ghcr.io/klugko/code-racer-server:${{ github.sha }}
